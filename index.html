<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solano Squad Roster</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #000c19; color: white; }
        .bg-logo-blur {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('logo.jpg');
            background-size: cover; background-position: center;
            filter: blur(30px) brightness(0.1);
            z-index: -1;
        }
    </style>
</head>
<body class="font-sans pb-10">
    <div class="bg-logo-blur"></div>

    <!-- Header -->
    <header class="p-6 text-center border-b border-yellow-500/20">
        <h1 class="text-3xl font-black italic tracking-tighter text-white">SOLANO <span class="text-yellow-400">SQUAD</span></h1>
        <p class="text-[10px] text-yellow-500 font-bold tracking-widest uppercase">Nueva Vizcaya Representatives</p>
    </header>

    <main class="max-w-md mx-auto px-4 mt-6">
        
        <!-- Coaches Section -->
        <h3 class="text-xs font-bold text-yellow-500 uppercase mb-4 tracking-widest text-center">Coaching Staff</h3>
        <div class="grid grid-cols-2 gap-4 mb-10">
            <div class="bg-blue-900/40 border border-yellow-500/50 p-4 rounded-2xl text-center">
                <img src="zydren.png" class="w-24 h-24 rounded-full mx-auto mb-3 border-4 border-yellow-400">
                <h4 class="font-bold text-lg">Zydren</h4>
                <p class="text-[10px] text-yellow-400 uppercase font-bold">Head Coach</p>
            </div>
            <div class="bg-blue-900/40 border border-yellow-500/50 p-4 rounded-2xl text-center">
                <img src="carlo.jpg" class="w-24 h-24 rounded-full mx-auto mb-3 border-4 border-yellow-400">
                <h4 class="font-bold text-lg">Carlo D.</h4>
                <p class="text-[10px] text-yellow-400 uppercase font-bold">Manager</p>
            </div>
        </div>

        <!-- Roster Section -->
        <h3 class="text-xs font-bold text-yellow-500 uppercase mb-4 tracking-widest text-center">Active Roster</h3>
        <div class="grid grid-cols-2 gap-4">
            <!-- Player Card Template: Ginawa nating mas malaki -->
            <div class="bg-blue-950/60 p-5 rounded-2xl border border-blue-800 text-center shadow-lg">
                <img src="shinji.jpg" class="w-28 h-28 rounded-full mx-auto mb-4 border-4 border-yellow-500">
                <h4 class="font-bold text-md">Shinji</h4>
                <p class="text-[10px] text-yellow-400 uppercase font-bold">Jungler</p>
            </div>
            <div class="bg-blue-950/60 p-5 rounded-2xl border border-blue-800 text-center shadow-lg">
                <img src="jassel.jpg" class="w-28 h-28 rounded-full mx-auto mb-4 border-4 border-yellow-500">
                <h4 class="font-bold text-md">Jassel</h4>
                <p class="text-[10px] text-yellow-400 uppercase font-bold">Roamer</p>
            </div>
            <div class="bg-blue-950/60 p-5 rounded-2xl border border-blue-800 text-center shadow-lg">
                <img src="dags.jpg" class="w-28 h-28 rounded-full mx-auto mb-4 border-4 border-yellow-500">
                <h4 class="font-bold text-md">Dags</h4>
                <p class="text-[10px] text-yellow-400 uppercase font-bold">EXP Lane</p>
            </div>
            <div class="bg-blue-950/60 p-5 rounded-2xl border border-blue-800 text-center shadow-lg">
                <img src="allen.jpg" class="w-28 h-28 rounded-full mx-auto mb-4 border-4 border-yellow-500">
                <h4 class="font-bold text-md">Allen</h4>
                <p class="text-[10px] text-yellow-400 uppercase font-bold">Mid Lane</p>
            </div>
            <div class="bg-blue-950/60 p-5 rounded-2xl border border-blue-800 text-center shadow-lg">
                <img src="umali.jpg" class="w-28 h-28 rounded-full mx-auto mb-4 border-4 border-yellow-500">
                <h4 class="font-bold text-md">Umali</h4>
                <p class="text-[10px] text-yellow-400 uppercase font-bold">EXP Lane</p>
            </div>
            <div class="bg-blue-950/60 p-5 rounded-2xl border border-blue-800 text-center shadow-lg">
                <img src="benter.jpg" class="w-28 h-28 rounded-full mx-auto mb-4 border-4 border-yellow-500">
                <h4 class="font-bold text-md">Benter</h4>
                <p class="text-[10px] text-yellow-400 uppercase font-bold">Gold Lane</p>
            </div>
            <div class="bg-blue-950/60 p-5 rounded-2xl border border-blue-800 text-center shadow-lg col-span-2">
                <img src="jomie.jpg" class="w-28 h-28 rounded-full mx-auto mb-4 border-4 border-yellow-500">
                <h4 class="font-bold text-md">Jomie Rae</h4>
                <p class="text-[10px] text-yellow-400 uppercase font-bold">6th Man</p>
            </div>
        </div>
    </main>
</body>
</html>
